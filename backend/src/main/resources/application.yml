server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://shortline.proxy.rlwy.net:17880/railway}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:bArYEflmGreWSwTkWSqSeGJJwkhqokHo}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 30
          fetch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDISHOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDISPORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDISPASSWORD:}}

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbi1kZW1vLXVzZS1vbmx5}
    expiration: 86400000  # 24 hours
  rate-limit:
    max-requests: 10
    window-seconds: 60
